[project]
name = "quantlab"
version = "0.1.0"
description = "Research-only strategy discovery and validation pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["quantlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
